function makeDb(){
 const sb=window.SB=supabase.createClient(CFG.url,CFG.key),T='docs';
 const chk=r=>{if(r.error)throw r.error;return r};
 return{collection:n=>({doc:id=>({
  set:async d=>chk(await sb.from(T).upsert({coll:n,id,data:d})),
  create:async d=>chk(await sb.from(T).insert({coll:n,id,data:d})),

 onSnapshot(f,ef){let ready=false;const m={},emit=()=>ready&&f({docs:Object.keys(m).map(k=>({id:k,data:()=>m[k]}))});

/*LINEUP*/
const FM={'4-3-3':[['GK',1,88],['DEF',4,68],['MID',3,46],['FWD',3,20]],
'4-4-2':[['GK',1,88],['DEF',4,68],['MID',4,46],['FWD',2,20]],

function slotsOf(f){const o=[];(FM[f]||FM['4-3-3']).forEach(([pos,n,y])=>{for(let i=0;i<n;i++)o.push({pos,x:(i+1)/(n+1)*100,y})});return o}

function buildLU(sq,fm,xi){
 const used=new Set(),res=slotsOf(fm).map((s,i)=>{const p=sq.find(q=>q.id===xi[i]&&!used.has(q.id));if(p)used.add(p.id);return{s,p}});

 res.forEach(r=>{if(!r.p){const p=sq.find(q=>!used.has(q.id));if(p){r.p=p;used.add(p.id)}}});
 res.fm=fm;return res;
}

}

const ageOf=n=>AGES[nk(n)]||26;
const gw=v=>v%10===1&&v%100!==11?'гол':(v%10>=2&&v%10<=4&&(v%100<10||v%100>=20))?'гола':'голов';
const seasonNo=()=>season&&season.n?season.n:1;
function ageUp(p){
 const a=(+p.age||26)+1,eg=p.pos==='GK'?a-3:a;
 let b=eg<=18?4:eg===19?3.5:eg===20?3:eg===21?2.5:eg===22?2:eg===23?1.2:eg===24?.7:eg===25?.3:eg<=28?0:eg===29?-.3:eg===30?-.8:eg===31?-1.3:eg===32?-1.8:eg===33?-2.4:eg===34?-3:-3.5;
 const r=+p.rating;if(b>0)b*=Math.max(.25,1-Math.max(0,r-78)/25);
 const nz=(Math.random()+Math.random()-1)*(b>1?2.2:1.6),nr=Math.max(45,Math.min(95,Math.round(r+b+nz))),d=nr-r;
 return{age:a,rating:nr,d,value:Math.max(.5,+((+p.value)*Math.exp(.09*d)*(a<=21?1.08:a>=31?.85:1)).toFixed(1))};
}
async function fixAges(){
 const J=players.filter(p=>!p.age);
 for(let i=0;i<J.length;i+=10)await Promise.all(J.slice(i,i+10).map(p=>col('players').doc(p.id).update({age:ageOf(p.name)}).catch(()=>{})));
}

}
async function nextSeason(){
 const n=seasonNo(),open=matches.filter(m=>!m.done);
 const mr=cupm.length?Math.max(...cupm.map(m=>m.r)):0,fin=cupm.filter(m=>m.r===mr),cp=fin.length===1&&fin[0].done?fin[0].w:'';
 const lg=matches.length&&!open.length?standings()[0].id:'';
 let warn='';if(!lg)warn+='Чемпионат не завершён, чемпион не запишется. ';if(!cp)warn+='Лига чемпионов не завершена, победитель не запишется. ';
 if(!await dlg(warn+'Завершить сезон '+n+' и начать сезон '+(n+1)+'? Игроки станут на год старше, рейтинги и цены изменятся, таблица и сетка очистятся.',{cancel:1}))return;
 try{
  const G={};[...matches,...cupm].forEach(m=>((m.done&&m.ev)||[]).forEach(e=>{if(e.p){const g=G[e.p]=G[e.p]||{n:ruName(e.pn),c:e.s?m.a:m.h,v:0};g.v++}}));
  const t=Object.values(G).sort((a,b)=>b.v-a.v)[0];
  await col('hist').doc('s'+String(n).padStart(3,'0')).set({n,lg,lgn:lg?cname(lg):'',cp,cpn:cp?cname(cp):'',ts:t?t.n+', '+t.v+' '+gw(t.v)+' ('+cname(t.c)+')':''});
  const ps=players.slice();
  for(let i=0;i<ps.length;i+=10)await Promise.all(ps.slice(i,i+10).map(p=>col('players').doc(p.id).update(ageUp(p))));
  for(const c of clubs)await col('clubs').doc(c.id).update({budget:+((+c.budget)+40+(c.id===lg?60:0)+(c.id===cp?80:0)).toFixed(1)});
  for(const o of offers.filter(o=>o.status==='open'))await col('offers').doc(o.id).update({status:'rejected',note:'Сезон завершён'});
  for(let i=0;i<cupm.length;i+=10)await Promise.all(cupm.slice(i,i+10).map(m=>col('cupm').doc(m.id).delete()));
  for(const k of ['now','sched'])try{await col('live').doc(k).delete()}catch(e){}
  await col('live').doc('season').set({n:n+1,ts:Date.now()});
  tTab='hist';
 }catch(e){return alert('Ошибка: '+(e.message||e.code))}
 await startSeason();
}
